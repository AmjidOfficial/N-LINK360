<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16A34A" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('nlink_theme_mode');
          var isDark = mode === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <title>N-LINK 360</title>
    <meta name="description" content="National Lights Integrated Sales, Recovery, Inventory & Distribution Management System" />
    <meta property="og:title" content="N-LINK 360" />
    <meta property="og:description" content="National Lights Integrated Sales, Recovery, Inventory & Distribution Management System" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      #nl-boot-shell {
        display: flex;
        min-height: 100dvh;
        width: 100%;
        background: #f8fafc;
        color: #0f172a;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      html.dark #nl-boot-shell,
      html[data-theme="dark"] #nl-boot-shell {
        background: #0b1120;
        color: #f8fafc;
      }
      #nl-boot-sidebar {
        display: none;
        width: 240px;
        flex-shrink: 0;
        background: #0f172a;
        border-right: 1px solid #1e293b;
        padding: 18px 14px;
        flex-direction: column;
        gap: 14px;
      }
      @media (min-width: 1024px) {
        #nl-boot-sidebar {
          display: flex;
        }
      }
      #nl-boot-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #nl-boot-topbar {
        height: 56px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      html.dark #nl-boot-topbar {
        background: #0f172a;
        border-bottom-color: #1e293b;
      }
      #nl-boot-content {
        padding: 20px;
        max-width: 1440px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .nl-boot-kpis {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      @media (min-width: 1024px) {
        .nl-boot-kpis {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .nl-boot-card {
        height: 92px;
        border-radius: 16px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      html.dark .nl-boot-card {
        background: #1e293b;
        border-color: #334155;
      }
      .nl-boot-shimmer {
        border-radius: 8px;
        background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: nlBootPulse 1.4s ease-in-out infinite;
      }
      html.dark .nl-boot-shimmer {
        background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
        background-size: 200% 100%;
      }
      .nl-boot-nav-pill {
        height: 36px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
      }
      @keyframes nlBootPulse {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="nl-boot-shell" aria-busy="true" aria-label="Loading N-LINK 360 workspace">
        <aside id="nl-boot-sidebar">
          <div style="display:flex;align-items:center;gap:10px;padding:4px 6px 12px;border-bottom:1px solid #1e293b;">
            <svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="19" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
              <circle cx="20" cy="14" r="6" fill="#f97316" />
              <path d="M12 24h16v3H12zm3 5h10v3H15z" fill="#16a34a" />
            </svg>
            <div>
              <div style="font-size:14px;font-weight:800;color:#ffffff;letter-spacing:-0.01em;">N-LINK 360</div>
              <div style="font-size:10px;font-weight:600;color:#94a3b8;">National Light ERP</div>
            </div>
          </div>
          <div class="nl-boot-nav-pill" style="background:rgba(22,163,74,0.28);"></div>
          <div class="nl-boot-nav-pill"></div>
          <div class="nl-boot-nav-pill"></div>
          <div class="nl-boot-nav-pill"></div>
          <div class="nl-boot-nav-pill"></div>
        </aside>
        <div id="nl-boot-main">
          <header id="nl-boot-topbar">
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:10px;height:10px;border-radius:999px;background:#16a34a;"></div>
              <span style="font-size:15px;font-weight:700;letter-spacing:-0.01em;">N-LINK 360</span>
            </div>
            <span style="font-size:12px;font-weight:600;color:#64748b;">Loading workspace…</span>
          </header>
          <div id="nl-boot-content">
            <div class="nl-boot-kpis">
              <div class="nl-boot-card">
                <div class="nl-boot-shimmer" style="height:12px;width:55%;"></div>
                <div class="nl-boot-shimmer" style="height:24px;width:75%;"></div>
              </div>
              <div class="nl-boot-card">
                <div class="nl-boot-shimmer" style="height:12px;width:50%;"></div>
                <div class="nl-boot-shimmer" style="height:24px;width:70%;"></div>
              </div>
              <div class="nl-boot-card">
                <div class="nl-boot-shimmer" style="height:12px;width:60%;"></div>
                <div class="nl-boot-shimmer" style="height:24px;width:65%;"></div>
              </div>
              <div class="nl-boot-card">
                <div class="nl-boot-shimmer" style="height:12px;width:48%;"></div>
                <div class="nl-boot-shimmer" style="height:24px;width:72%;"></div>
              </div>
            </div>
            <div class="nl-boot-card" style="height:220px;gap:14px;">
              <div class="nl-boot-shimmer" style="height:16px;width:36%;"></div>
              <div class="nl-boot-shimmer" style="flex:1;width:100%;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
