name: N-LINK-360 Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - rebuild/unified-department-dashboards-2026-11-15

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Unit and business-rule tests
        run: npm test
      - name: Production build
        run: npm run build
