name: N-LINK 360 quality checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # The current AI Studio package.json is ahead of the committed lockfile.
        # npm install resolves the declared versions and refreshes the lock in CI.
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Business rules tests
        run: npm test

      - name: Production static build
        run: npm run build:static
