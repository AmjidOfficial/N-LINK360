name: Deploy N-LINK 360 to GitHub Pages ($0 Forever)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The repository's package.json was ahead of its committed lockfile.
      # Reconcile it with the pinned Node 22/npm toolchain, commit the exact
      # lockfile used by this build, and then install strictly with npm ci.
      - name: Regenerate npm lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed npm lockfile
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile with package manifest"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "package-lock.json is already in sync."
          fi

      - name: Install dependencies from the committed lockfile
        run: npm ci

      - name: Build static PWA bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_GOOGLE_SHEETS_WEBHOOK_URL: ${{ vars.VITE_GOOGLE_SHEETS_WEBHOOK_URL || '' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
        run: |
          npx vite build --mode gh-pages
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
